<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="portclue overview of local TCP listeners">
  <title>portclue overview</title>
  <defs>
    <style>
      .frame { fill: #1e1e1e; }
      .chrome { fill: #2d2d2d; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .title { fill: #9a9a9a; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .prompt { fill: #7dcfb6; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cmd { fill: #f0f0f0; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .out { fill: #d6d6d6; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hdr { fill: #9bbcff; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dim { fill: #8a8a8a; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="920" height="360" rx="10" class="frame"/>
  <rect width="920" height="34" rx="10" class="chrome"/>
  <rect y="20" width="920" height="14" class="chrome"/>
  <circle cx="18" cy="17" r="5" class="dot-r"/>
  <circle cx="36" cy="17" r="5" class="dot-y"/>
  <circle cx="54" cy="17" r="5" class="dot-g"/>
  <text x="460" y="21" text-anchor="middle" class="title">portclue  local TCP overview</text>

  <text x="20" y="58"><tspan class="prompt">$</tspan><tspan class="cmd"> sudo portclue</tspan></text>
  <text x="20" y="84" class="out">LOCAL TCP LISTENERS</text>
  <text x="20" y="112" class="hdr">PORT    SERVICE                   CONFIDENCE BIND            OWNER       SOURCE BIND SCOPE</text>
  <text x="20" y="134" class="out">22      OpenSSH server            HIGH       0.0.0.0,::      ssh.service host   ALL_INTERFACES</text>
  <text x="20" y="154" class="out">8080    NGINX web server          HIGH       0.0.0.0,::      nginx       host   ALL_INTERFACES</text>
  <text x="20" y="174" class="out">8443    api service               MEDIUM     192.0.2.10      demo-api    docker SPECIFIC_INTERFACE</text>
  <text x="20" y="194" class="out">9000    Python HTTP server        MEDIUM     127.0.0.1       python3     host   LOOPBACK_ONLY</text>
  <text x="20" y="228" class="dim">BIND SCOPE describes socket binding, not firewall reachability.</text>
  <text x="20" y="248" class="dim">Run `portclue PORT` for the complete evidence chain and local exposure verdict.</text>
</svg>
