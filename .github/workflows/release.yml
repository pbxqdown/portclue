name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - name: Build release archives
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Verify amd64 version
        run: |
          archive="dist/portclue-${GITHUB_REF_NAME#v}-linux-amd64.tar.gz"
          mkdir -p /tmp/portclue-release-check
          tar -xzf "$archive" -C /tmp/portclue-release-check
          test "$(/tmp/portclue-release-check/portclue-${GITHUB_REF_NAME#v}-linux-amd64/portclue --version)" = "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
